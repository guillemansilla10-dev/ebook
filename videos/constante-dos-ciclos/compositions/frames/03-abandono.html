  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      const P = "#f03-";
      const NODE = {xPercent:-50, yPercent:-50};
      tl.fromTo(P+"tag", {opacity:0, y:20}, {opacity:1, y:0, duration:0.6, ease:E}, 0.0);
      tl.fromTo(P+"title", {opacity:0, y:30}, {opacity:1, y:0, duration:0.7, ease:E}, 0.15);
      tl.fromTo(P+"circ", {attr:{"stroke-dashoffset":2004.3}}, {attr:{"stroke-dashoffset":0}, duration:1.0, ease:"power2.inOut"}, 0.3);
      tl.fromTo(P+"orbit", {opacity:0}, {opacity:1, duration:0.3}, 1.0);
      const T0 = 1.0, STEP = 0.8;
      for (let i = 0; i < 5; i++) {
        const t = T0 + i * STEP;
        if (i > 0) tl.to(P+"orbit", {rotation:72*i, duration:0.6, ease:"power2.inOut"}, t - 0.55);
        tl.fromTo(P+"n"+i, {...NODE, opacity:0, scale:0.85}, {...NODE, opacity:1, scale:1, duration:0.55, ease:E}, t);
      }
      // darken the downward spiral
      tl.to(P+"n3", {color:"#6b5f62", duration:0.4}, T0+3*STEP+0.3);
      tl.to(P+"n4", {color:"#8a7f80", borderColor:"#cfc6bb", duration:0.4}, T0+4*STEP+0.3);
      // back to start
      tl.to(P+"orbit", {rotation:360, duration:0.8, ease:"power2.inOut"}, 4.9);
      tl.to(P+"n0", {scale:1.08, borderColor:"#7c5360", duration:0.35, ease:E}, 5.6);
      tl.to(P+"n0", {scale:1, duration:0.4, ease:"power2.out"}, 5.95);
      tl.fromTo(P+"loop", {opacity:0, rotation:-120, scale:0.8}, {opacity:1, rotation:0, scale:1, duration:0.9, ease:E}, 5.3);
      tl.fromTo(P+"again", {opacity:0, y:16}, {opacity:1, y:0, duration:0.6, ease:E}, 5.7);
      tl.fromTo(P+"foot", {opacity:0}, {opacity:1, duration:0.6}, 0.3);

      tl.set({}, {}, 7);
      window.__timelines["03-abandono"] = tl;
    })();
