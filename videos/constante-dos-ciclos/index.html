<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f4eee3;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-giro"
        class="scene"
        data-composition-id="02-giro"
        data-composition-src="compositions/frames/02-giro.html"
        data-start="6"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-abandono"
        class="scene"
        data-composition-id="03-abandono"
        data-composition-src="compositions/frames/03-abandono.html"
        data-start="11"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-constancia"
        class="scene"
        data-composition-id="04-constancia"
        data-composition-src="compositions/frames/04-constancia.html"
        data-start="18"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="25"
        data-duration="5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-02-giro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.addLabel("hf:transition:01-hook:02-giro:crossfade", 6);
        tl.to("#el-02-giro", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.fromTo("#el-03-abandono", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.addLabel("hf:transition:02-giro:03-abandono:crossfade", 11);
        tl.to("#el-03-abandono", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-04-constancia", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.addLabel("hf:transition:03-abandono:04-constancia:crossfade", 18);
        tl.to("#el-04-constancia", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.addLabel("hf:transition:04-constancia:05-cta:crossfade", 25);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
